# sys-firstdata-api-v1-uat.yaml
# UAT environment — staging endpoints (UAT uses staging per Apigee KVM config)

sys-firstdata.http-listener.port: "8081"
sys-firstdata.http-listener.path: "/sys/firstdata/v1/*"

sys-firstdata-api.http-listener.autodiscovery-id: "0"

sys.server.hosts: "staging1.datawire.net:443,staging2.datawire.net:443"
sys.default-server-host: "staging1.datawire.net"
sys.path-suffix: "sd"
sys.service-id: "104"
sys.request-version: "3"
sys.application-version: "V001000"
sys.payload-encoding: "datawire"
sys.transaction-prefix: "SV."
sys.field-separator: "|1C"
sys.user-agent: "vxnapi_xml_3_2_0_19"

sys.timeout-responses: "205,8"
sys.invalidate-cache-responses: "8"
sys.url-cache-ttl: "300"

sys.whitelisted-brands: "yankee candle,marmot"
sys.app-id: "NWLECOMMWGIFTXML"
sys.tid: "00000000002"

marmot.terminal-id: "0002"
marmot.merchant-key-id: "NOKEY"
marmot.source-code: "30"
marmot.activate-promo-code: "79234"

yankee-candle.terminal-id: "0001"
yankee-candle.merchant-key-id: "1002"
yankee-candle.source-code: "30"
yankee-candle.activate-promo-code: "30253"

notification.enabled: "true"
