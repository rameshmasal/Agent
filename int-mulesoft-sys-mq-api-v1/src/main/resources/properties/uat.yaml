#API configuration doc
sys-mq-api:
  http-listener:
    port: "8081"
    path: "/api/*"
    timeout: "180000"
    idle-timeout: "180000"
    auto-discovery-id: "21250084"   # API Manager ID is only known after the API is registered; "0" is the Newell placeholder
  timeout: "60000"

system:
  postman: "76e7a33b1b3749d49c7c4baef5bfac98"
  deck: "21e26990179641228e261d3207a76771"
  narvar: "7c69640bef484420be9e3e53bc2b1115"

system-creds:
  postman:
    client-id: "fda67bfa5906460983d7c73e2608244b"
  deck:
    client-id: "fda67bfa5906460983d7c73e2608244b"
  narvar:  
    client-id: "1c98eba54aba406c854ab9383c2be991"
  
#Anypoint MQ configuration (downstream) - the queue name comes from the request path
anypoint-mq:
  protocol: "HTTPS"
  host: "mq-us-east-1.anypoint.mulesoft.com"
  port: "443"
  base-path: "/api/v1"
  org-id: "7ce124c3-15c9-4cbd-a7c4-7273f3dd4bdb"
  env-id: "37814b06-3cab-4ce1-b4fb-f94814a2099f"
  timeout: "30000"
  idle-timeout: "30000"
  auth-scheme: "bearer"
  content-type: "application/json"
  retry:
    max-retries: "2"
    delay-ms: "1000"

#Anypoint Platform token service (downstream)
anypoint-auth:
  protocol: "HTTPS"
  host: "anypoint.mulesoft.com"
  port: "443"
  path: "/accounts/oauth2/token"
  grant-type: "client_credentials"
  content-type: "application/json"
  timeout: "30000"
  idle-timeout: "30000"
  token-ttl-seconds: "3300"   # token lives 1 hour; refresh early
  
#Single-line log statements
logging:
  enabled: "true"
  max-payload-chars: "100000"
  status:
    success: "Success"
    error: "Error"
  messages:
    api-request: "Received request to write message to queue"
    mq-request: "Placing message on queue"
    mq-response: "Anypoint MQ responded with status"
    api-response: "Message placed successfully, returning status"
    error: "Failed to process"

#Slack notification (server-side errors only)
notification:
  api-name: "sys-mq-api-v1"

#Application Messages
application-msgs:
  status-failure: "FAILURE"
  status-success: "SUCCESS"
  code-500: "500"
  status-code-200: "200"
  status-code-201: "201"
  status-code-400: "400"
  status-code-401: "401"
  status-code-404: "404"
  status-code-405: "405"
  status-code-406: "406"
  status-code-415: "415"
  status-code-500: "500"
  status-code-501: "501"
  status-code-502: "502"
  status-code-503: "503"
  status-code-504: "504"
  type-http-error: "HTTP:ERROR"
  type-http-success: "HTTP:SUCCESS"
  msg-success: "Request processed successfully!"
  msg-error: "Error has occured while processing"
  msg-invalid-json: "Request body is empty or not valid JSON."
  msg-queue-not-found: "Queue not found in Anypoint MQ:"
  msg-mq-unexpected-status: "Anypoint MQ returned unexpected status"
  msg-token-failure: "Unable to obtain the Anypoint access token."
  msg-mq-auth-failure: "Anypoint MQ refused the access token."
